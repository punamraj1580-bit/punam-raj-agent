name: Punam Raj Auto Video Agent

on:
  schedule:
    - cron: "30 1 * * *"   # 01:30 UTC = subah 7:00 baje IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = sirf video banao, post mat karo (test ke liye)"
        default: "0"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Fonts & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-deva libraqm0 ffmpeg
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate 3 Daily Videos
        run: python agent.py generate

      - name: Save Videos to Repo (Required for Meta Graph API URL)
        run: |
          git config user.name "punam-raj-agent"
          git config user.email "agent@users.noreply.github.com"
          git add out
          git commit -m "Generated daily videos $(date +%F)" || echo "Nothing new to commit"
          git push

      - name: Post Everywhere (YouTube, Instagram, Facebook, Telegram)
        run: python agent.py post
